# Predictive Joint Training Pilot Configuration
# Purpose-built for CPU probe and lightweight joint adaptation

model:
  name_or_path: "epfl-dlab/zip2zip-Phi-3.5-mini-instruct-v0.1"
  torch_dtype: "float16"           # Backbone frozen in float16; trainable modules cast to float32 on CPU

compression:
  budget_k: 32                      # K=32 active hypertoken slots per prompt
  max_subtokens: 4                  # Up to 4 base tokens per hypertoken
  initial_vocab_size: 32011
  pad_token_id: 32000

policy:
  max_structural_slots: 0           # 0 structural slots (eliminates newline/indentation drift)
  allow_numeric: true               # Numbers are permitted
  filter_bare_punctuation: true     # Eliminates bare punctuation chains

trainable_modules:
  trainable_mode: "joint"           # "joint": LoRA + input_encoder + output_encoder (base model frozen)
                                    # Fallback ablation: "encoders_only" (input_encoder + output_encoder)

loss:
  lm_ce_weight: 1.0                 # Next-token prediction cross-entropy
  reconstruction_weight: 0.1        # Upstream Zip2Zip Section 2.4 auxiliary reconstruction loss (lambda=0.1)

curriculum:
  curriculum_density: 1.0           # 1.0 = full budget; deterministic prefix slicing for lower values

training:
  batch_size: 1                     # Micro-batch size
  gradient_accumulation_steps: 1    # 1 for raw CPU probe timing
  learning_rate: 1.0e-5             # Conservative LR matching upstream Zip2Zip fine-tuning
  weight_decay: 0.01
  max_grad_norm: 1.0
  max_steps: 10                     # Hard cap for probe

checkpointing:
  save_steps: 5                     # Checkpoint at steps 5 and 10
  output_dir: "experiments/checkpoints/predictive_joint_pilot"
